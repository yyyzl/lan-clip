name: Build Lan Clip
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.target }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: android
          - os: windows-2025
            target: windows
          - os: macos-15
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Restore Android signing key
        if: matrix.target == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Android release signing secret is missing.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lan-clip.jks"
          chmod 600 "$RUNNER_TEMP/lan-clip.jks"
      - name: Build signed Android APKs
        if: matrix.target == 'android'
        env:
          REQUIRE_RELEASE_SIGNING: 'true'
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lan-clip.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi
      - name: Package Android
        if: matrix.target == 'android'
        shell: bash
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/Lan-Clip-Android-$abi.apk"
          done
      - name: Build Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release
      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/Lan-Clip-Windows-x64.zip
      - name: Build macOS
        if: matrix.target == 'macos'
        run: flutter build macos --release
      - name: Verify and package macOS
        if: matrix.target == 'macos'
        run: |
          APP='build/macos/Build/Products/Release/Lan Clip.app'
          lipo -verify_arch arm64 x86_64 "$APP/Contents/MacOS/Lan Clip"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" dist/Lan-Clip-Mac-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lan-Clip-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove Android signing key
        if: always() && matrix.target == 'android'
        shell: bash
        run: rm -f "$RUNNER_TEMP/lan-clip.jks"
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Lan-Clip-*
          path: dist
          merge-multiple: true
      - name: Publish packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.apk *.zip > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --title "轻贴 $RELEASE_TAG" --notes-file ../docs/release-notes.md --verify-tag
